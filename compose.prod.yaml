# Local usage profile: immutable production image, no source-code bind mount.
services:
  app:
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5472}:8080"
    environment:
      SERVER_NAME: :8080
      APP_ENV: prod
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/var/cache
      - /app/var/log
      - /app/var/share
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
