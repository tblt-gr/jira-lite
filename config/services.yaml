parameters:
    jira.base_url: '%env(JIRA_BASE_URL)%'
    jira.email: '%env(JIRA_EMAIL)%'
    jira.api_token: '%env(JIRA_API_TOKEN)%'
    trusted_hosts_default: '^(localhost|127\.0\.0\.1|\[::1\])$'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Jira\JiraClient:
        arguments:
            $baseUrl: '%jira.base_url%'
            $email: '%jira.email%'
            $apiToken: '%jira.api_token%'

    App\Jira\JiraMediaProxy:
        arguments:
            $baseUrl: '%jira.base_url%'
            $email: '%jira.email%'
            $apiToken: '%jira.api_token%'

    Symfony\Component\Security\Http\EventListener\IsCsrfTokenValidAttributeListener: ~

    App\Logger\SecretRedactingProcessor:
        arguments:
            $apiToken: '%jira.api_token%'
        tags:
            - { name: monolog.processor }
