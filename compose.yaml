# Development profile: source code is mounted and APP_ENV defaults to dev.
# Jira Lite is a local tool. It binds to the loopback interface by default.
#
# BIND_ADDRESS must stay 127.0.0.1 unless the application has been given
# authentication and authorization. Publishing on 0.0.0.0 exposes a Jira
# write API to every machine on the local network.
services:
  app:
    build:
      context: .
      target: frankenphp_dev
    container_name: jira-lite-app
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5472}:8080"
    environment:
      SERVER_NAME: :8080
      APP_ENV: ${APP_ENV:-dev}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./:/app
      - /app/var
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
