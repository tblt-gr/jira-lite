services:
  app:
    build:
      context: .
      target: frankenphp_dev
    container_name: jira-lite-app
    restart: unless-stopped
    ports:
      - "${PORT:-5472}:80"
    environment:
      SERVER_NAME: :80
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./:/app
      - /app/var
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
