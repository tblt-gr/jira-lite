name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  APP_ENV: test
  APP_SECRET: ci-dummy-secret
  JIRA_BASE_URL: https://ci-dummy.atlassian.net
  JIRA_EMAIL: ci-dummy@example.test
  JIRA_API_TOKEN: ci-dummy-token

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, intl
          coverage: pcov

      - name: Create .env file for build scripts
        run: cp .env.example .env

      - uses: ramsey/composer-install@v3

      - name: composer validate
        run: composer validate --strict --no-check-publish

      - name: composer audit
        run: composer audit

      - name: composer cs
        run: composer cs

      - name: warm dev container for PHPStan
        run: php bin/console cache:warmup --env=dev

      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

      - name: lint:container
        run: php bin/console lint:container

      - name: lint:container (no-debug)
        run: php bin/console lint:container --no-debug

      - name: lint:yaml
        run: php bin/console lint:yaml config

      - name: lint:twig
        run: php bin/console lint:twig templates

      - name: lint:translations
        run: php bin/console lint:translations --locale=fr

      - name: phpunit
        run: php bin/phpunit

      - name: coverage
        run: composer coverage

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    name: Docker production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          push: false
          load: true
          tags: jira-lite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production image
        run: |
          docker run --detach --name jira-lite-ci --publish 8080:8080 \
            -e APP_SECRET=ci-dummy-secret \
            -e JIRA_BASE_URL=https://ci-dummy.atlassian.net \
            -e JIRA_EMAIL=ci-dummy@example.test \
            -e JIRA_API_TOKEN=ci-dummy-token \
            jira-lite:ci
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs jira-lite-ci
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force jira-lite-ci || true

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [php, js, docker]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed" >&2
            exit 1
          fi
