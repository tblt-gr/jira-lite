name: Bug report
description: Report a reproducible problem in Jira Lite
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Jira Lite is local-only. Never include Jira URLs, emails, API tokens or issue content that is not safe to share."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jira Lite version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, Docker/PHP version and browser. Redact all credentials."
